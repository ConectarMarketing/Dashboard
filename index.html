<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Mídia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div>
      <h1>Controle de mídia · clientes</h1>
      <p class="sub" id="origem">Carregando…</p>
    </div>
    <div class="acoes">
      <label class="botao">
        Abrir planilha (.xlsx)
        <input type="file" id="arquivo" accept=".xlsx" hidden>
      </label>
    </div>
  </header>

  <nav class="abas" id="abas" role="tablist" aria-label="Clientes"></nav>

  <main id="conteudo">
    <p class="aviso" id="aviso" hidden></p>
  </main>

  <script src="xlsx.js"></script>
  <script src="app.js"></script>
</body>
</html>
